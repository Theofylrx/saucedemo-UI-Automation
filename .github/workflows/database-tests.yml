name: Database Integration Tests (Schema Validation)
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: write
  statuses: write

jobs:
  database-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
      options: --network-alias playwright

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: |
          apt-get update
          apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h postgres -U testuser; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
        env:
          PGPASSWORD: testpass

      - name: Initialize Database Schema
        run: PGPASSWORD=testpass psql -h postgres -U testuser -d testdb -f lib/database/init/01_create_tables.sql
        env:
          PGPASSWORD: testpass

      - name: Seed Database with Test Data
        run: PGPASSWORD=testpass psql -h postgres -U testuser -d testdb -f lib/database/init/02_seed_data.sql
        env:
          PGPASSWORD: testpass

      - name: Run Database Integration Tests
        run: ENVIRONMENT=DEMO npx playwright test --grep "@database" --project=chromium
        env:
          DATABASE_URL: postgresql://testuser:testpass@postgres:5432/testdb

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: database-test-results
          path: |
            ./test-results/
            ./test-results/ctrf-report.json
          retention-days: 7
        if: always()

      - name: Publish CTRF Test Summary Results
        shell: bash
        run: npx github-actions-ctrf ./test-results/ctrf-report.json
        if: always()
