name: API Integration Tests (Schema Validation)
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: write
  statuses: write

jobs:
  api-tests:
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Run API Integration Tests
        run: ENVIRONMENT=DEMO npx playwright test --grep "@api" --project=chromium
        env:
          API_BASE_URL: https://jsonplaceholder.typicode.com

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: |
            ./test-results/
            ./test-results/ctrf-report.json
          retention-days: 7
        if: always()

      - name: Publish CTRF Test Summary Results
        shell: bash
        run: npx github-actions-ctrf ./test-results/ctrf-report.json
        if: always()
